<template>
  <div class="oc-page">
    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading application" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load this application</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={handleRetry}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <div class="oc-breadcrumb">
        <span>OpenCore</span><span class="oc-crumb-sep">/</span>
        <span class="oc-link" onclick={goToApplications}>Applications</span><span class="oc-crumb-sep">/</span>
        <span class="oc-crumb-current">Review</span>
      </div>

      <div class="oc-header">
        <div class="oc-header-title">
          <span class="oc-eyebrow">Application Review</span>
          <h1 class="oc-title">{applicantName}</h1>
          <p class="oc-subtitle">Applied for "{issueTitle}" in {repositoryName} &middot; {appliedDateLabel}</p>
        </div>
        <div class="oc-header-actions">
          <button class="oc-btn oc-btn-danger" type="button" onclick={handleReject} disabled={isDecided}>Reject</button>
          <button class="oc-btn oc-btn-success" type="button" onclick={handleApprove} disabled={isDecided}>Approve</button>
        </div>
      </div>

      <template if:true={decisionMade}>
        <div class="oc-card oc-card-pad oc-decision-banner oc-section">
          <p>{decisionMessage}</p>
        </div>
      </template>

      <template if:false={decisionMade}>
        <div class="oc-card oc-card-pad oc-section">
          <div class="oc-field">
            <label>Review Comments <template if:true={commentsRequiredNote}>(required to reject)</template></label>
            <textarea class="oc-textarea" rows="2" onchange={handleCommentsChange} value={reviewComments}></textarea>
          </div>
        </div>
      </template>

      <div class="oc-grid oc-grid-2col oc-section">
        <div>
          <div class="oc-card oc-card-pad oc-section">
            <p class="oc-card-title">Applicant Profile</p>
            <div class="oc-profile-row">
              <div class="oc-avatar oc-avatar-lg">{applicantInitials}</div>
              <div>
                <p class="oc-list-row-title">{applicantName}</p>
                <p class="oc-list-row-sub">{applicantTitle}</p>
                <p class="oc-list-row-sub">Reputation: {applicantReputation}</p>
              </div>
            </div>
            <template if:true={applicantBio}>
              <p class="oc-body-text oc-bio">{applicantBio}</p>
            </template>
          </div>

          <div class="oc-card oc-card-pad">
            <p class="oc-card-title">Skills</p>
            <template if:true={hasSkills}>
              <div class="oc-tech-row">
                <template for:each={applicantSkills} for:item="skill">
                  <span class="oc-tech-tag" key={skill}>{skill}</span>
                </template>
              </div>
            </template>
            <template if:false={hasSkills}>
              <div class="oc-empty oc-empty-inline"><p>No skills recorded.</p></div>
            </template>
          </div>
        </div>

        <div>
          <div class="oc-card oc-card-pad oc-section">
            <p class="oc-card-title">Resume</p>
            <div class="oc-resume-placeholder">
              <span class="oc-resume-icon">▤</span>
              <p>Resume not attached in this org</p>
            </div>
          </div>

          <div class="oc-card oc-card-pad">
            <p class="oc-card-title">GitHub Profile</p>
            <template if:true={applicantGithub}>
              <div class="oc-repo-mini">
                <div class="oc-logo-tile oc-logo-tile-sm">GH</div>
                <div>
                  <p class="oc-list-row-title">{applicantGithub}</p>
                </div>
              </div>
              <a class="oc-btn oc-btn-sm oc-full-width" href={githubUrl} target="_blank" rel="noopener">View GitHub ↗</a>
            </template>
            <template if:false={applicantGithub}>
              <div class="oc-empty oc-empty-inline"><p>No GitHub username on file.</p></div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
