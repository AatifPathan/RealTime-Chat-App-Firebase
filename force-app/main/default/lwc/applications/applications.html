<template>
  <div class="oc-page">
    <div class="oc-breadcrumb">
      <span>OpenCore</span><span class="oc-crumb-sep">/</span><span class="oc-crumb-current">Applications</span>
    </div>

    <div class="oc-header">
      <div class="oc-header-title">
        <span class="oc-eyebrow">Review</span>
        <h1 class="oc-title">Applications</h1>
        <p class="oc-subtitle">{totalCount} applications submitted for open issues across OpenCore.</p>
      </div>
      <div class="oc-header-actions">
        <div class="oc-search">
          <span class="oc-search-icon">⌕</span>
          <input type="text" placeholder="Search applicants..." value={searchTerm} onchange={handleSearch} />
        </div>
      </div>
    </div>

    <div class="oc-chip-row">
      <template for:each={filters} for:item="f">
        <button key={f.value} class={f.chipClass} type="button" data-value={f.value} onclick={handleFilter}>{f.label}</button>
      </template>
    </div>

    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading applications" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load applications</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={loadApplications}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <div class="oc-table-wrap">
        <table class="oc-table">
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Issue</th>
              <th>Repository</th>
              <th>Applied Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={applications} for:item="app">
              <tr key={app.id} data-id={app.id} onclick={handleRowClick}>
                <td>
                  <div class="oc-repo-cell">
                    <div class="oc-avatar oc-avatar-sm">{app.initials}</div>
                    <span class="oc-cell-primary">{app.applicantName}</span>
                  </div>
                </td>
                <td>{app.issueTitle}</td>
                <td>{app.repositoryName}</td>
                <td>{app.appliedDateLabel}</td>
                <td><span class={app.statusClass}>{app.status}</span></td>
              </tr>
            </template>
          </tbody>
        </table>
        <template if:true={isEmpty}>
          <div class="oc-empty">
            <div class="oc-empty-icon">◌</div>
            <p>No applications match your filters.</p>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
