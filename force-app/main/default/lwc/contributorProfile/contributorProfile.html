<template>
  <div class="oc-page">
    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading contributor" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load this contributor</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={handleRetry}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <div class="oc-breadcrumb">
        <span>OpenCore</span><span class="oc-crumb-sep">/</span>
        <span class="oc-link" onclick={goToContributors}>Contributors</span><span class="oc-crumb-sep">/</span>
        <span class="oc-crumb-current">{contributor.name}</span>
      </div>

      <div class="oc-header">
        <div class="oc-header-title">
          <div class="oc-repo-title-row">
            <div class="oc-avatar oc-avatar-lg">{contributor.initials}</div>
            <div>
              <h1 class="oc-title">{contributor.name}</h1>
              <p class="oc-subtitle">{contributor.role} &middot; Joined {contributor.joinedLabel}</p>
            </div>
          </div>
        </div>
        <div class="oc-header-actions">
          <button class="oc-btn" type="button">Message</button>
          <button class="oc-btn oc-btn-primary" type="button">Follow</button>
        </div>
      </div>

      <template if:true={contributor.bio}>
        <p class="oc-card-desc oc-repo-desc">{contributor.bio}</p>
      </template>

      <div class="oc-grid oc-grid-4 oc-section">
        <div class="oc-kpi-card"><div class="oc-kpi-value">{repositories.length}</div><div class="oc-kpi-label">Repositories</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{contributionCount}</div><div class="oc-kpi-label">Contributions</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{badges.length}</div><div class="oc-kpi-label">Badges Earned</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{contributor.reputation}</div><div class="oc-kpi-label">Reputation</div></div>
      </div>

      <div class="oc-grid oc-grid-2 oc-section">
        <div class="oc-card oc-card-pad">
          <p class="oc-card-title">Contribution Timeline</p>
          <template if:true={hasTimeline}>
            <div class="oc-timeline oc-timeline-top">
              <template for:each={timeline} for:item="t">
                <div class="oc-timeline-item" key={t.id}>
                  <span class="oc-timeline-dot"></span>
                  <div class="oc-timeline-text">{t.text}</div>
                  <div class="oc-timeline-meta">{t.meta}</div>
                </div>
              </template>
            </div>
          </template>
          <template if:false={hasTimeline}>
            <div class="oc-empty oc-empty-inline"><p>No activity recorded yet.</p></div>
          </template>
        </div>

        <div class="oc-card oc-card-pad">
          <p class="oc-card-title">Skills</p>
          <template if:true={hasSkills}>
            <div class="oc-skill-list oc-skill-top">
              <template for:each={skills} for:item="s">
                <div class="oc-skill-bar-row" key={s.name}>
                  <div class="oc-progress-row">
                    <span>{s.name}</span>
                    <span>{s.level}%</span>
                  </div>
                  <div class="oc-progress">
                    <div class="oc-progress-bar" style={s.style}></div>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <template if:false={hasSkills}>
            <div class="oc-empty oc-empty-inline"><p>No skills recorded yet.</p></div>
          </template>
        </div>
      </div>

      <div class="oc-section">
        <div class="oc-section-head"><p class="oc-section-title">Repositories</p></div>
        <template if:true={hasRepositories}>
          <div class="oc-grid oc-grid-3">
            <template for:each={repositories} for:item="r">
              <div class="oc-card oc-card-pad oc-card-hover" key={r.id} data-id={r.id} onclick={goToRepositoryDetail}>
                <p class="oc-list-row-title">{r.name}</p>
                <p class="oc-list-row-sub">{r.commits} issues resolved</p>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasRepositories}>
          <div class="oc-empty"><p>No repositories yet.</p></div>
        </template>
      </div>

      <div class="oc-grid oc-grid-2">
        <div>
          <div class="oc-section-head"><p class="oc-section-title">Projects</p></div>
          <template if:true={hasProjects}>
            <template for:each={projects} for:item="p">
              <div class="oc-card oc-card-pad oc-list-margin" key={p.id}>
                <p class="oc-list-row-title">{p.name}</p>
                <p class="oc-list-row-sub">{p.role}</p>
              </div>
            </template>
          </template>
          <template if:false={hasProjects}>
            <div class="oc-empty"><p>No projects yet.</p></div>
          </template>
        </div>
        <div>
          <div class="oc-section-head"><p class="oc-section-title">Badges</p></div>
          <template if:true={hasBadges}>
            <div class="oc-badge-grid">
              <template for:each={badges} for:item="b">
                <div class="oc-badge-tile" key={b.name}>
                  <div class="oc-badge-icon">{b.icon}</div>
                  <p class="oc-badge-name">{b.name}</p>
                </div>
              </template>
            </div>
          </template>
          <template if:false={hasBadges}>
            <div class="oc-empty"><p>No badges earned yet.</p></div>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>
