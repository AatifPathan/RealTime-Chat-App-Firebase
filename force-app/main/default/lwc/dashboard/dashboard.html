<template>
  <div class="oc-page">
    <div class="oc-breadcrumb">
      <span>OpenCore</span>
      <span class="oc-crumb-sep">/</span>
      <span class="oc-crumb-current">Dashboard</span>
    </div>

    <div class="oc-header">
      <div class="oc-header-title">
        <span class="oc-eyebrow">Overview</span>
        <h1 class="oc-title">Dashboard</h1>
        <p class="oc-subtitle">Here's what's happening across your open-source ecosystem today.</p>
      </div>
      <div class="oc-header-actions">
        <button class="oc-btn" type="button">Export report</button>
        <button class="oc-btn oc-btn-primary" type="button" onclick={handleNewProject}>+ New Project</button>
      </div>
    </div>

    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading dashboard" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner oc-section">
        <p class="oc-card-title">Couldn't load the dashboard</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={handleRetry}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <!-- KPI Cards -->
      <div class="oc-grid oc-grid-6 oc-section">
        <template for:each={kpis} for:item="kpi">
          <div class="oc-kpi-card" key={kpi.label}>
            <div class="oc-kpi-top">
              <div class="oc-kpi-icon">{kpi.icon}</div>
            </div>
            <div class="oc-kpi-value">{kpi.value}</div>
            <div class="oc-kpi-label">{kpi.label}</div>
          </div>
        </template>
      </div>

      <!-- Charts -->
      <div class="oc-grid oc-grid-3 oc-section">
        <div class="oc-card oc-card-pad">
          <p class="oc-card-title">Contributions this week</p>
          <p class="oc-card-desc">Activity log entries across all repositories</p>
          <template if:true={hasBarChart}>
            <div class="oc-chart-placeholder">
              <div class="oc-bar-chart">
                <template for:each={barChart} for:item="bar">
                  <div class="oc-bar-col" key={bar.label}>
                    <div class="oc-bar" style={bar.style}></div>
                    <span class="oc-bar-label">{bar.label}</span>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <template if:false={hasBarChart}>
            <div class="oc-empty oc-empty-inline">
              <p>No activity recorded in the last 7 days.</p>
            </div>
          </template>
        </div>

        <div class="oc-card oc-card-pad">
          <p class="oc-card-title">Open Issues</p>
          <p class="oc-card-desc">Issues currently awaiting a contributor</p>
          <div class="oc-metric-block">
            <span class="oc-metric-value">{kpiOpenIssues}</span>
            <span class="oc-metric-label">open across all repositories</span>
          </div>
        </div>

        <div class="oc-card oc-card-pad">
          <p class="oc-card-title">Pending Applications</p>
          <p class="oc-card-desc">Applications awaiting mentor review</p>
          <div class="oc-metric-block">
            <span class="oc-metric-value">{kpiPendingApplications}</span>
            <span class="oc-metric-label">awaiting review</span>
          </div>
        </div>
      </div>

      <div class="oc-grid oc-grid-2 oc-section">
        <!-- Recent Activity -->
        <div class="oc-card oc-card-pad">
          <div class="oc-section-head">
            <p class="oc-section-title">Recent Activity</p>
          </div>
          <template if:true={hasActivity}>
            <div class="oc-timeline">
              <template for:each={activity} for:item="item">
                <div class="oc-timeline-item" key={item.id}>
                  <span class="oc-timeline-dot"></span>
                  <div class="oc-timeline-text">{item.text}</div>
                  <div class="oc-timeline-meta">{item.meta}</div>
                </div>
              </template>
            </div>
          </template>
          <template if:false={hasActivity}>
            <div class="oc-empty oc-empty-inline"><p>No recent activity yet.</p></div>
          </template>
        </div>

        <!-- Recent Repositories -->
        <div class="oc-card oc-card-pad">
          <div class="oc-section-head">
            <p class="oc-section-title">Recent Repositories</p>
            <a class="oc-link" onclick={goToRepositories}>View all</a>
          </div>
          <template if:true={hasRepos}>
            <template for:each={recentRepos} for:item="repo">
              <div class="oc-list-row" key={repo.id} data-id={repo.id} onclick={goToRepositoryDetail}>
                <div class="oc-logo-tile oc-logo-tile-sm">{repo.initials}</div>
                <div class="oc-list-row-body">
                  <p class="oc-list-row-title">{repo.name}</p>
                  <p class="oc-list-row-sub">{repo.language} &middot; ★ {repo.stars}</p>
                </div>
                <span class={repo.badgeClass}>{repo.difficulty}</span>
              </div>
            </template>
          </template>
          <template if:false={hasRepos}>
            <div class="oc-empty oc-empty-inline"><p>No repositories yet.</p></div>
          </template>
        </div>
      </div>

      <div class="oc-grid oc-grid-2">
        <!-- Recent Contributors -->
        <div class="oc-card oc-card-pad">
          <div class="oc-section-head">
            <p class="oc-section-title">Recent Contributors</p>
          </div>
          <template if:true={hasContributors}>
            <template for:each={recentContributors} for:item="c">
              <div class="oc-list-row" key={c.id}>
                <div class="oc-avatar oc-avatar-sm">{c.initials}</div>
                <div class="oc-list-row-body">
                  <p class="oc-list-row-title">{c.name}</p>
                  <p class="oc-list-row-sub">{c.role}</p>
                </div>
                <span class="oc-badge oc-badge-blue">{c.reputation} pts</span>
              </div>
            </template>
          </template>
          <template if:false={hasContributors}>
            <div class="oc-empty oc-empty-inline"><p>No contributors yet.</p></div>
          </template>
        </div>

        <!-- Recent Projects -->
        <div class="oc-card oc-card-pad">
          <div class="oc-section-head">
            <p class="oc-section-title">Recent Projects</p>
          </div>
          <template if:true={hasProjects}>
            <template for:each={recentProjects} for:item="p">
              <div class="oc-list-row" key={p.id}>
                <div class="oc-list-row-body">
                  <p class="oc-list-row-title">{p.name}</p>
                  <div class="oc-progress">
                    <div class="oc-progress-bar" style={p.style}></div>
                  </div>
                </div>
                <span class="oc-progress-pct">{p.progress}%</span>
              </div>
            </template>
          </template>
          <template if:false={hasProjects}>
            <div class="oc-empty oc-empty-inline"><p>No projects yet.</p></div>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>
