<template>
  <div class="oc-page">
    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading issue" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load this issue</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={handleRetry}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <div class="oc-breadcrumb">
        <span>OpenCore</span><span class="oc-crumb-sep">/</span>
        <span class="oc-link" onclick={goToIssues}>Issues</span><span class="oc-crumb-sep">/</span>
        <span class="oc-crumb-current">{issue.issueNumber}</span>
      </div>

      <div class="oc-header">
        <div class="oc-header-title">
          <div class="oc-issue-badges">
            <span class={issue.statusClass}>{issue.status}</span>
            <span class={issue.diffClass}>{issue.difficulty}</span>
          </div>
          <h1 class="oc-title">{issue.title}</h1>
          <p class="oc-subtitle">{issue.issueNumber} in {issue.repositoryName} &middot; {organizationName}</p>
        </div>
        <div class="oc-header-actions">
          <button class="oc-btn" type="button" onclick={handleViewRepo}>View Repository</button>
          <button class="oc-btn oc-btn-primary" type="button" onclick={handleApply} disabled={isApplying}>Apply</button>
        </div>
      </div>

      <div class="oc-grid oc-grid-2col oc-section">
        <div>
          <div class="oc-card oc-card-pad oc-section">
            <p class="oc-card-title">Description</p>
            <template if:true={issue.summary}>
              <p class="oc-body-text">{issue.summary}</p>
            </template>
            <template if:false={issue.summary}>
              <div class="oc-empty oc-empty-inline"><p>No description provided.</p></div>
            </template>
          </div>

          <div class="oc-card oc-card-pad">
            <p class="oc-card-title">Requirements</p>
            <template if:true={hasRequirements}>
              <ul class="oc-req-list">
                <template for:each={requirements} for:item="req">
                  <li key={req}>{req}</li>
                </template>
              </ul>
            </template>
            <template if:false={hasRequirements}>
              <div class="oc-empty oc-empty-inline"><p>No specific requirements listed.</p></div>
            </template>
          </div>
        </div>

        <div>
          <div class="oc-card oc-card-pad oc-section">
            <p class="oc-card-title">Skills Needed</p>
            <template if:true={hasSkills}>
              <div class="oc-tech-row">
                <template for:each={skills} for:item="skill">
                  <span class="oc-tech-tag" key={skill}>{skill}</span>
                </template>
              </div>
            </template>
            <template if:false={hasSkills}>
              <div class="oc-empty oc-empty-inline"><p>No specific skills listed.</p></div>
            </template>
          </div>

          <div class="oc-card oc-card-pad oc-section">
            <p class="oc-card-title">Repository</p>
            <div class="oc-repo-mini">
              <div class="oc-logo-tile oc-logo-tile-sm">{repoInitials}</div>
              <div>
                <p class="oc-list-row-title">{issue.repositoryName}</p>
                <p class="oc-list-row-sub">{repositoryLanguage}</p>
              </div>
            </div>
          </div>

          <div class="oc-card oc-card-pad">
            <p class="oc-card-title">Organization</p>
            <p class="oc-list-row-title">{organizationName}</p>
            <p class="oc-list-row-sub">{organizationCategory}</p>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
