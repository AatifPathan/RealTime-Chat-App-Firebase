<template>
  <div class="oc-page">
    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading organization" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load this organization</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={handleRetry}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <div class="oc-breadcrumb">
        <span>OpenCore</span><span class="oc-crumb-sep">/</span>
        <span class="oc-link" onclick={goToOrganizations}>Organizations</span><span class="oc-crumb-sep">/</span>
        <span class="oc-crumb-current">{org.name}</span>
      </div>

      <div class="oc-header">
        <div class="oc-header-title">
          <div class="oc-repo-title-row">
            <div class="oc-logo-tile oc-logo-lg" style={org.logoStyle}>{org.initials}</div>
            <div>
              <h1 class="oc-title">{org.name}</h1>
              <p class="oc-subtitle">{org.category} <template if:true={mentorName}>&middot; Mentor: {mentorName}</template></p>
            </div>
          </div>
        </div>
        <div class="oc-header-actions">
          <template if:true={org.website}>
            <a class="oc-btn" href={org.website} target="_blank" rel="noopener">Website ↗</a>
          </template>
          <button class="oc-btn oc-btn-primary" type="button">Follow Organization</button>
        </div>
      </div>

      <p class="oc-card-desc oc-repo-desc">{org.description}</p>

      <div class="oc-tech-row oc-section">
        <template for:each={org.stack} for:item="tech">
          <span class="oc-tech-tag" key={tech}>{tech}</span>
        </template>
      </div>

      <div class="oc-grid oc-grid-4 oc-section">
        <div class="oc-kpi-card"><div class="oc-kpi-value">{org.repoCount}</div><div class="oc-kpi-label">Repositories</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{org.contributorCount}</div><div class="oc-kpi-label">Contributors</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{projects.length}</div><div class="oc-kpi-label">Active Projects</div></div>
        <div class="oc-kpi-card"><div class="oc-kpi-value">{repositories.length}</div><div class="oc-kpi-label">Repos Listed</div></div>
      </div>

      <div class="oc-section">
        <div class="oc-section-head">
          <p class="oc-section-title">Repositories</p>
        </div>
        <template if:true={hasRepositories}>
          <div class="oc-grid oc-grid-3">
            <template for:each={repositories} for:item="r">
              <div class="oc-card oc-card-pad oc-card-hover" key={r.id} data-id={r.id} onclick={goToRepositoryDetail}>
                <p class="oc-card-title">{r.name}</p>
                <p class="oc-list-row-sub">{r.language} &middot; ★ {r.stars}</p>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasRepositories}>
          <div class="oc-empty"><p>No repositories yet.</p></div>
        </template>
      </div>

      <div class="oc-grid oc-grid-2 oc-section">
        <div>
          <div class="oc-section-head">
            <p class="oc-section-title">Projects</p>
          </div>
          <template if:true={hasProjects}>
            <template for:each={projects} for:item="p">
              <div class="oc-card oc-card-pad oc-list-margin" key={p.id}>
                <p class="oc-list-row-title">{p.name}</p>
                <div class="oc-progress">
                  <div class="oc-progress-bar" style={p.style}></div>
                </div>
              </div>
            </template>
          </template>
          <template if:false={hasProjects}>
            <div class="oc-empty"><p>No active projects.</p></div>
          </template>
        </div>

        <div>
          <div class="oc-section-head">
            <p class="oc-section-title">Contributors</p>
          </div>
          <template if:true={hasContributors}>
            <div class="oc-card oc-card-pad">
              <template for:each={contributors} for:item="c">
                <div class="oc-list-row" key={c.id}>
                  <div class="oc-avatar oc-avatar-sm">{c.initials}</div>
                  <div class="oc-list-row-body">
                    <p class="oc-list-row-title">{c.name}</p>
                    <p class="oc-list-row-sub">{c.role}</p>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <template if:false={hasContributors}>
            <div class="oc-empty"><p>No contributors linked yet.</p></div>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>
