<template>
  <div class="oc-page">
    <div class="oc-breadcrumb">
      <span>OpenCore</span><span class="oc-crumb-sep">/</span><span class="oc-crumb-current">Organizations</span>
    </div>

    <div class="oc-header">
      <div class="oc-header-title">
        <span class="oc-eyebrow">Explore</span>
        <h1 class="oc-title">Organizations</h1>
        <p class="oc-subtitle">{totalCount} organizations building in the open on OpenCore.</p>
      </div>
      <div class="oc-header-actions">
        <div class="oc-search">
          <span class="oc-search-icon">⌕</span>
          <input type="text" placeholder="Search organizations..." value={searchTerm} onchange={handleSearch} />
        </div>
        <button class="oc-btn oc-btn-primary" type="button" onclick={handleOpenCreate}>+ New Organization</button>
      </div>
    </div>

    <template if:true={showCreateModal}>
      <div class="oc-modal-backdrop" onclick={handleCloseCreate}>
        <div class="oc-modal-card" onclick={stopPropagation}>
          <p class="oc-card-title">New Organization</p>

          <template if:true={createErrorMessage}>
            <div class="oc-register-error">{createErrorMessage}</div>
          </template>

          <div class="oc-field">
            <label>Name</label>
            <input class="oc-input" type="text" value={createForm.name} onchange={handleCreateFieldChange} data-field="name" />
          </div>
          <div class="oc-field">
            <label>Description</label>
            <textarea class="oc-textarea" rows="2" onchange={handleCreateFieldChange} data-field="description"></textarea>
          </div>
          <div class="oc-field">
            <label>Website</label>
            <input class="oc-input" type="text" value={createForm.website} onchange={handleCreateFieldChange} data-field="website" />
          </div>
          <div class="oc-field">
            <label>Tech Stack <span class="oc-field-hint-inline">(comma-separated, e.g. TypeScript, Go)</span></label>
            <input class="oc-input" type="text" value={createForm.techStack} onchange={handleCreateFieldChange} data-field="techStack" />
          </div>

          <div class="oc-modal-actions">
            <button class="oc-btn" type="button" onclick={handleCloseCreate}>Cancel</button>
            <button class="oc-btn oc-btn-primary" type="button" onclick={handleCreateSubmit} disabled={isCreating}>{createSubmitLabel}</button>
          </div>
        </div>
      </div>
    </template>

    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading organizations" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load organizations</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={loadOrganizations}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <template if:true={isEmpty}>
        <div class="oc-empty">
          <div class="oc-empty-icon">◌</div>
          <p>No organizations match "{searchTerm}"</p>
        </div>
      </template>

      <template if:false={isEmpty}>
        <div class="oc-grid oc-grid-3">
          <template for:each={organizations} for:item="org">
            <div class="oc-card oc-card-pad oc-card-hover oc-org-card" key={org.id} data-id={org.id} onclick={handleCardClick}>
              <div class="oc-org-card-head">
                <div class="oc-logo-tile" style={org.logoStyle}>{org.initials}</div>
                <div>
                  <p class="oc-card-title">{org.name}</p>
                  <p class="oc-list-row-sub">{org.category}</p>
                </div>
              </div>
              <p class="oc-card-desc oc-org-desc">{org.description}</p>
              <div class="oc-tech-row">
                <template for:each={org.stack} for:item="tech">
                  <span class="oc-tech-tag" key={tech}>{tech}</span>
                </template>
              </div>
              <div class="oc-org-stats">
                <div class="oc-stat-row"><span class="oc-stat-icon">⌘</span>{org.repoCount} repositories</div>
                <div class="oc-stat-row"><span class="oc-stat-icon">◍</span>{org.contributorCount} contributors</div>
              </div>
            </div>
          </template>
        </div>

        <template if:true={hasPagination}>
          <div class="oc-pagination">
            <button class="oc-btn oc-btn-sm" type="button" disabled={isFirstPage} onclick={handlePrevPage}>← Previous</button>
            <span class="oc-pagination-label">Page {pageNumber} of {totalPages}</span>
            <button class="oc-btn oc-btn-sm" type="button" disabled={isLastPage} onclick={handleNextPage}>Next →</button>
          </div>
        </template>
      </template>
    </template>
  </div>
</template>
