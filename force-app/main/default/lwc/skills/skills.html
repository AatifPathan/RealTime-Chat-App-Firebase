<template>
  <div class="oc-page">
    <div class="oc-breadcrumb">
      <span>OpenCore</span><span class="oc-crumb-sep">/</span><span class="oc-crumb-current">Skills</span>
    </div>

    <div class="oc-header">
      <div class="oc-header-title">
        <span class="oc-eyebrow">Growth</span>
        <h1 class="oc-title">Skills</h1>
        <p class="oc-subtitle">Track your proficiency and discover projects that grow each skill.</p>
      </div>
    </div>

    <template if:true={isLoading}>
      <div class="oc-loading-wrap">
        <lightning-spinner alternative-text="Loading skills" size="medium"></lightning-spinner>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="oc-card oc-card-pad oc-error-banner">
        <p class="oc-card-title">Couldn't load skills</p>
        <p class="oc-card-desc">{errorMessage}</p>
        <button class="oc-btn oc-btn-sm" type="button" onclick={loadSkills}>Retry</button>
      </div>
    </template>

    <template if:true={showContent}>
      <template if:true={isEmpty}>
        <div class="oc-empty">
          <div class="oc-empty-icon">◌</div>
          <p>No skills have been configured yet.</p>
        </div>
      </template>

      <template if:false={isEmpty}>
        <div class="oc-grid oc-grid-3">
          <template for:each={skills} for:item="s">
            <div class="oc-card oc-card-pad" key={s.id}>
              <div class="oc-skill-head">
                <div class="oc-kpi-icon">{s.icon}</div>
                <div>
                  <p class="oc-card-title">{s.name}</p>
                  <p class="oc-list-row-sub">{s.category}</p>
                </div>
              </div>
              <div class="oc-progress-row">
                <span>Proficiency</span>
                <span>{s.level}%</span>
              </div>
              <div class="oc-progress">
                <div class="oc-progress-bar" style={s.style}></div>
              </div>
              <p class="oc-projects-using">Used in {s.projectCount} active project(s)</p>
              <template if:true={s.hasProjects}>
                <div class="oc-tech-row">
                  <template for:each={s.projects} for:item="proj">
                    <span class="oc-tech-tag" key={proj}>{proj}</span>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </template>
  </div>
</template>
